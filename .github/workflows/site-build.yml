name: Verify Weekly CERTI site build
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/**'
      - 'package.json'
      - '.github/workflows/site-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
