name: Weekly certification update
on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-certification-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Collect global certification news
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/update.mjs
      - name: Publish collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish certification weekly issue'
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
